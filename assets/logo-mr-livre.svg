<!-- assets/logo-mr-livre.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9e7b23;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Círculo externo -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="8 4"/>
  <!-- Texto central -->
  <text x="100" y="110" text-anchor="middle" font-family="'Playfair Display', serif" font-size="52" font-weight="700" fill="#d4af37">MR</text>
  <text x="100" y="138" text-anchor="middle" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#9e7b23" letter-spacing="4">LIVRE</text>
</svg>
